  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#000; touch-action:none; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center;
         font-family:'Press Start 2P', monospace;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #game { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; touch-action:none; display:block;
          filter: saturate(1.12) contrast(1.2) brightness(0.9); }

  /* bloom: blurred, brightened, warmed copy of the frame, screen-blended */
  #bloom { position:absolute; inset:0; width:100%; height:100%; z-index:2;
           pointer-events:none; mix-blend-mode:screen; opacity:0.6;
           filter: blur(3px) brightness(1.25) saturate(1.4); image-rendering:auto; }

  /* HD-2D vibe: warm color grade + tilt-shift depth-of-field + vignette */
  #grade { position:absolute; inset:0; z-index:3; pointer-events:none;
           background: linear-gradient(rgba(70,120,190,0.22), rgba(6,10,22,0.36));
           mix-blend-mode: soft-light; }
  #godray { position:absolute; inset:0; z-index:4; pointer-events:none; mix-blend-mode:screen; opacity:0.4;
            background:
              repeating-linear-gradient(101deg, rgba(170,205,255,0) 0px, rgba(170,205,255,0.045) 1px, rgba(170,205,255,0) 7px),
              radial-gradient(120% 80% at 50% -10%, rgba(120,150,210,0.26), rgba(120,150,210,0) 60%); }
  /* medium HD-2D depth of field:
     visible softness at distance/foreground without smearing the whole scene */
  #dof { position:absolute; inset:0; z-index:4; pointer-events:none;
         -webkit-backdrop-filter: blur(3.4px); backdrop-filter: blur(3.4px);
         opacity:0.88;
         -webkit-mask: linear-gradient(to bottom,
           rgba(0,0,0,0.76) 0%,
           rgba(0,0,0,0.46) 13%,
           rgba(0,0,0,0.14) 24%,
           transparent 34%,
           transparent 69%,
           rgba(0,0,0,0.14) 80%,
           rgba(0,0,0,0.44) 91%,
           rgba(0,0,0,0.74) 100%);
                 mask: linear-gradient(to bottom,
           rgba(0,0,0,0.76) 0%,
           rgba(0,0,0,0.46) 13%,
           rgba(0,0,0,0.14) 24%,
           transparent 34%,
           transparent 69%,
           rgba(0,0,0,0.14) 80%,
           rgba(0,0,0,0.44) 91%,
           rgba(0,0,0,0.74) 100%); }

  #dof::before { content:''; position:absolute; inset:0;
         -webkit-backdrop-filter: blur(2.4px); backdrop-filter: blur(2.4px);
         -webkit-mask: linear-gradient(to bottom,
           transparent 0%,
           transparent 76%,
           rgba(0,0,0,0.12) 84%,
           rgba(0,0,0,0.56) 100%);
                 mask: linear-gradient(to bottom,
           transparent 0%,
           transparent 76%,
           rgba(0,0,0,0.12) 84%,
           rgba(0,0,0,0.56) 100%); }

  #dof::after { content:''; position:absolute; inset:0;
         -webkit-backdrop-filter: blur(2.2px); backdrop-filter: blur(2.2px);
         -webkit-mask: linear-gradient(to bottom,
           rgba(0,0,0,0.56) 0%,
           rgba(0,0,0,0.12) 18%,
           transparent 30%);
                 mask: linear-gradient(to bottom,
           rgba(0,0,0,0.56) 0%,
           rgba(0,0,0,0.12) 18%,
           transparent 30%); }
  #vignette { position:absolute; inset:0; z-index:4; pointer-events:none;
              background: radial-gradient(135% 130% at 50% 42%, transparent 52%, rgba(0,0,0,0.52) 100%); }



  /* game screen: subtle CRT tube (rounded, vignette, drop shadow) */
  #screen { position:fixed; inset:0; overflow:hidden; box-shadow: inset 0 0 44px rgba(0,0,0,0.5); }

  /* CRT overlay: scanlines + vignette + slow rolling scan (taps pass through) */
  #crt { position:absolute; inset:0; z-index:6; pointer-events:none;
         background: repeating-linear-gradient(to bottom,
                     rgba(0,0,0,0.08) 0 1px, transparent 1px 4px);
         mix-blend-mode:multiply; }
  #crt::after { content:''; position:absolute; inset:0;
                box-shadow: inset 2px 0 6px rgba(255,40,40,0.05),
                            inset -2px 0 6px rgba(40,200,255,0.05); }   /* faint edge fringing */
  #crt::before { content:''; position:absolute; left:0; right:0; height:34%;
                 background: linear-gradient(rgba(255,255,255,0.022), transparent);
                 animation: crtRoll 7s linear infinite; }
  @keyframes crtRoll { 0%{ top:-34% } 100%{ top:100% } }
  @media (prefers-reduced-motion: reduce){ #crt::before { display:none; } }

  /* settings gear + panel */
  #gear { position:absolute; top:6px; right:6px; z-index:8; width:26px; height:26px;
          display:flex; align-items:center; justify-content:center; cursor:pointer;
          background:rgba(10,12,16,0.6); border:2px solid rgba(255,255,255,0.5);
          border-radius:6px; color:#fff; font-size:14px; }
  #settings { position:absolute; inset:0; z-index:20; display:none;
              align-items:center; justify-content:center; background:rgba(0,0,0,0.72); }
  #settings.open { display:flex; }
  #settings .panel { background:#0a0c10; border:3px solid #fff; border-radius:6px;
              padding:14px 16px; width:80%; max-width:300px; color:#fff;
              font-family:'Press Start 2P',monospace; box-shadow:5px 5px 0 rgba(0,0,0,0.6); }
  #settings h2 { font-size:10px; margin-bottom:14px; letter-spacing:1px; text-align:center; }
  .setrow { display:flex; align-items:center; justify-content:space-between; margin:11px 0; font-size:8px; }
  .toggle { border:2px solid #fff; border-radius:4px; padding:5px 8px; font-size:8px;
            cursor:pointer; min-width:50px; text-align:center; }
  .toggle.on  { background:#6dd3a8; color:#05070a; border-color:#6dd3a8; }
  .toggle.off { background:transparent; color:#8fa0b2; border-color:#8fa0b2; }
  #settings .close { display:block; margin:16px auto 0; border:2px solid #fff; border-radius:4px;
              padding:7px 14px; font-size:8px; cursor:pointer; color:#fff; text-align:center; }
  #settings .close:active { background:#fff; color:#000; }

  /* dialogue: crisp HTML layer over the canvas, chunky retro box */
  #dialogue { position:absolute; left:3%; right:3%; bottom:3.5%; min-height:22%; z-index:5;
              box-sizing:border-box; padding:8px 12px; background:#0a0c10; border:3px solid #fff;
              color:#fff; font-family:'GameThai','IBM Plex Sans Thai',sans-serif;
              line-height:1.5; white-space:pre-line;
              box-shadow: inset 0 0 0 2px #0a0c10, 4px 4px 0 rgba(0,0,0,0.6); }
  #dialogue.hidden { display:none; }
  #dlgarrow { position:absolute; right:10px; bottom:4px; }
  #reveal { position:absolute; inset:0; z-index:7; display:none; align-items:center; justify-content:center;
            background:#0a2a3a; color:#8fd0e8; text-align:center; padding:10%;
            font-family:'GameThai','IBM Plex Sans Thai',sans-serif; font-size:15px; line-height:1.6; }
  #reveal.show { display:flex; }
  #choices { position:absolute; left:0; right:0; bottom:28%; z-index:8; display:none; justify-content:center; gap:12px; }
  #choices.show { display:flex; }
  .choice { background:#0a0c10; border:3px solid #fff; color:#fff; border-radius:4px; padding:8px 14px; cursor:pointer;
            font-family:'GameThai','IBM Plex Sans Thai',sans-serif; font-size:13px; }
  .choice.sel { background:#6dd3a8; color:#05070a; border-color:#6dd3a8; }

  /* elevator depth readout */
  #depthHud { position:absolute; left:50%; top:5.5%; transform:translateX(-50%);
              z-index:9; display:none; pointer-events:none;
              padding:7px 10px; border:2px solid rgba(145,235,255,0.65);
              background:rgba(2,14,24,0.72); color:#a9efff;

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

/* ===================== HD-2D (three.js) engine ===================== */
const GAME = document.getElementById('game');
let RW = 384, RH = 240;   // recomputed in fit() to match the viewport
const renderer = new THREE.WebGLRenderer({ canvas:GAME, antialias:false, preserveDrawingBuffer:true });
renderer.setPixelRatio(1); renderer.setSize(RW, RH, false); renderer.setClearColor(0x030711, 1);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x030711);
scene.fog = new THREE.Fog(0x050a14, 14, 72);
// atmospheric night-sky dome: deep navy overhead, desaturated blue/violet near the horizon,
// plus faint natural airglow and uneven colour pockets inspired by long-exposure night skies.
const skyMat=new THREE.ShaderMaterial({
  uniforms:{
    cTop:{value:new THREE.Color(0x01030a)},
    cUpper:{value:new THREE.Color(0x03091b)},
    cMid:{value:new THREE.Color(0x08172c)},
    cLow:{value:new THREE.Color(0x12283d)},
    cHorizon:{value:new THREE.Color(0x1d2d3d)}
  },
  vertexShader:'varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:`uniform vec3 cTop; uniform vec3 cUpper; uniform vec3 cMid; uniform vec3 cLow; uniform vec3 cHorizon;
    varying vec3 vDir;
    void main(){
      float y=clamp(vDir.y,0.0,1.0);
      vec3 col;
      if(y<0.12) col=mix(cHorizon,cLow,y/0.12);
      else if(y<0.34) col=mix(cLow,cMid,(y-0.12)/0.22);
      else if(y<0.67) col=mix(cMid,cUpper,(y-0.34)/0.33);
      else col=mix(cUpper,cTop,(y-0.67)/0.33);

      float az=atan(vDir.x,vDir.z);
      float horizon=1.0-smoothstep(0.04,0.30,y);
      float airBand=exp(-pow((y-0.075)/0.065,2.0));
      float tealPatch=0.52+0.48*sin(az*1.45+0.55)+0.18*sin(az*3.1-1.2);
      tealPatch=clamp(tealPatch,0.0,1.0);
      col += vec3(0.008,0.030,0.027)*airBand*tealPatch;

      float warmPatch=pow(max(0.0,0.5+0.5*cos(az-2.25)),4.0);
      col += vec3(0.034,0.012,0.006)*horizon*warmPatch*0.30;

      float violetPatch=(0.5+0.5*sin(az*1.15-0.9))*smoothstep(0.18,0.62,y)*(1.0-smoothstep(0.82,1.0,y));
      col += vec3(0.008,0.003,0.018)*violetPatch;

      // very subtle broad atmospheric waviness, enough to stop the sky reading as a flat gradient
      float wav=sin(az*5.0+y*18.0)*sin(az*2.0-y*11.0);
      col += vec3(0.004,0.007,0.012)*wav*(0.25+0.75*horizon);
      gl_FragColor=vec4(col,1.0);
    }`,
  side:THREE.BackSide, fog:false, depthWrite:false });
const sky=new THREE.Mesh(new THREE.SphereGeometry(500,32,20), skyMat); scene.add(sky);
// starfield
const STAR_R=300, starPts=[];
function tooClose(x,y,z,minD2){ for(const p of starPts){ const dx=x-p[0], dy=y-p[1], dz=z-p[2]; if(dx*dx+dy*dy+dz*dz<minD2) return true; } return false; }
let tries=0;
while(starPts.length<280 && tries<9000){ tries++;
  const az=Math.random()*Math.PI*2;
  const el=0.05 + Math.pow(Math.random(),0.72)*1.10; // fill more of the upper sky
  const rr=STAR_R + (Math.random()-0.5)*4;
  const cx=Math.cos(el)*Math.sin(az), cy=Math.sin(el), cz=Math.cos(el)*Math.cos(az);
  const x=cx*rr, y=cy*rr, z=cz*rr;
  const minD2 = cy>0.72 ? 115 : (cy>0.45 ? 92 : 78); // cleaner spacing overhead, a little denser near horizon
  if(tooClose(x,y,z,minD2)) continue;
  starPts.push([x,y,z]);
}
const sp=new Float32Array(starPts.length*3);
const starCols=new Float32Array(starPts.length*3);
function starColor(){
  const r=Math.random();
  if(r<0.50) return new THREE.Color(0xffffff);
  if(r<0.69) return new THREE.Color(0xe9f3ff);
  if(r<0.82) return new THREE.Color(0xc9e0ff);
  if(r<0.91) return new THREE.Color(0xfff2ce);
  if(r<0.975) return new THREE.Color(0xffdca0);
  return new THREE.Color(0xffaa8a);
}
starPts.forEach((p,i)=>{
  sp[i*3]=p[0]; sp[i*3+1]=p[1]; sp[i*3+2]=p[2];
  const c=starColor();
  starCols[i*3]=c.r; starCols[i*3+1]=c.g; starCols[i*3+2]=c.b;
});
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(sp,3));
starGeo.setAttribute('color', new THREE.BufferAttribute(starCols,3));
const stars=new THREE.Points(starGeo, new THREE.PointsMaterial({
  vertexColors:true, size:1.35, sizeAttenuation:false,
  transparent:true, opacity:0.90, fog:false, depthWrite:false
}));
scene.add(stars);

// sparse brighter stars inherit the same spectral tint
const brightIds=[];
for(let i=0;i<starPts.length;i++) if(i%9===0) brightIds.push(i);
const bp=brightIds.map(i=>starPts[i]), bsp=new Float32Array(bp.length*3), bcol=new Float32Array(bp.length*3);
bp.forEach((p,i)=>{
  bsp[i*3]=p[0]; bsp[i*3+1]=p[1]; bsp[i*3+2]=p[2];
  const si=brightIds[i];
  const c=new THREE.Color(starCols[si*3],starCols[si*3+1],starCols[si*3+2]).lerp(new THREE.Color(0xffffff),0.12);
  bcol[i*3]=c.r; bcol[i*3+1]=c.g; bcol[i*3+2]=c.b;
});
const brightGeo=new THREE.BufferGeometry();
brightGeo.setAttribute('position', new THREE.BufferAttribute(bsp,3));
brightGeo.setAttribute('color', new THREE.BufferAttribute(bcol,3));
const brightStars=new THREE.Points(brightGeo, new THREE.PointsMaterial({
  vertexColors:true, size:2.05, sizeAttenuation:false,
  transparent:true, opacity:0.98, fog:false, depthWrite:false
}));
scene.add(brightStars);
// moon
function moonTexGen(){ const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,4,32,32,30); g.addColorStop(0,'rgba(242,247,255,1)'); g.addColorStop(0.55,'rgba(212,226,250,0.96)'); g.addColorStop(0.72,'rgba(160,186,236,0.4)'); g.addColorStop(1,'rgba(150,180,235,0)');
  x.fillStyle=g; x.beginPath(); x.arc(32,32,30,0,7); x.fill();
  x.fillStyle='rgba(178,198,236,0.55)'; x.beginPath(); x.arc(26,27,4,0,7); x.fill(); x.beginPath(); x.arc(40,36,3,0,7); x.fill(); x.beginPath(); x.arc(33,20,2,0,7); x.fill();
  return new THREE.CanvasTexture(c); }
const moonSpr=new THREE.Sprite(new THREE.SpriteMaterial({ map:moonTexGen(), transparent:true, depthWrite:false, fog:false }));
moonSpr.scale.set(56,56,1); scene.add(moonSpr);
const MOON_OFF=new THREE.Vector3(0,2.25,-13).normalize().multiplyScalar(240);
// --- Milky Way: broad, dusty, natural-colour stellar band with dark rifts ---
const milkyGroup=new THREE.Group(); scene.add(milkyGroup);
const MW_R=298, MW_TILT=0.82, mwC=Math.cos(MW_TILT), mwS=Math.sin(MW_TILT);
function mwDir(th,off){
  let x=Math.cos(th), y=off, z=Math.sin(th);
  const x2=x*mwC-y*mwS, y2=x*mwS+y*mwC, L=Math.hypot(x2,y2,z)||1;
  return [x2/L*MW_R,y2/L*MW_R,z/L*MW_R];
}
function aDist(a,b){ let d=Math.abs(a-b)%(Math.PI*2); return Math.min(d,Math.PI*2-d); }

// Fine stellar grain.  Colours stay mostly neutral, with only mild blue-white and cream variation.
const mwP=[], mwCol=[];
for(let i=0;i<2450;i++){
  const th=Math.random()*Math.PI*2;
  const core=Math.exp(-Math.pow(aDist(th,4.78)/0.74,2));
  const wing=0.16+0.08*Math.random()+0.035*core;
  let off=(Math.random()+Math.random()+Math.random()-1.5)*wing;
  // irregular central dust lane: fewer stars right through the middle, especially near the core
  const lane=0.020+0.018*(0.5+0.5*Math.sin(th*4.2+0.7));
  if(Math.abs(off)<lane && Math.random()<(0.68+0.20*core)) continue;
  const p=mwDir(th,off); mwP.push(p[0],p[1],p[2]);
  const r=Math.random(), b=0.70+0.22*Math.random()+0.09*core;
  if(r<0.11+0.08*core)      mwCol.push(1.00*b,0.88*b,0.72*b); // cream/gold stars
  else if(r<0.33)            mwCol.push(0.72*b,0.82*b,1.00*b); // pale blue-white
  else                       mwCol.push(0.90*b,0.92*b,0.96*b); // neutral white/gray
}
const mwGeo=new THREE.BufferGeometry();
mwGeo.setAttribute('position',new THREE.Float32BufferAttribute(mwP,3));
mwGeo.setAttribute('color',new THREE.Float32BufferAttribute(mwCol,3));
const mwStars=new THREE.Points(mwGeo,new THREE.PointsMaterial({vertexColors:true,size:1.28,sizeAttenuation:false,transparent:true,opacity:0.56,fog:false,depthWrite:false}));
milkyGroup.add(mwStars);

// A sparse brighter population gives the core and a few cloud knots sparkle without becoming neon.
const knotP=[], knotCol=[];
for(let i=0;i<360;i++){
  const th=Math.random()*Math.PI*2;
  const core=Math.exp(-Math.pow(aDist(th,4.78)/0.60,2));
  if(Math.random()>0.18+0.72*core) continue;
  const side=Math.random()<0.5?-1:1;
  const off=side*(0.040+Math.random()*0.105)+(Math.random()-0.5)*0.024;
  const p=mwDir(th,off); knotP.push(p[0],p[1],p[2]);
  const warm=Math.random()<0.32+0.20*core;
  if(warm) knotCol.push(1.0,0.85+Math.random()*0.08,0.70+Math.random()*0.09);
  else knotCol.push(0.78+Math.random()*0.10,0.85+Math.random()*0.10,1.0);
}
const knotGeo=new THREE.BufferGeometry(); knotGeo.setAttribute('position',new THREE.Float32BufferAttribute(knotP,3)); knotGeo.setAttribute('color',new THREE.Float32BufferAttribute(knotCol,3));
const mwKnots=new THREE.Points(knotGeo,new THREE.PointsMaterial({vertexColors:true,size:2.0,sizeAttenuation:false,transparent:true,opacity:0.70,fog:false,depthWrite:false}));
milkyGroup.add(mwKnots);

function mwCloudTex(){ const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,5,64,64,63);
  g.addColorStop(0,'rgba(255,255,255,0.48)'); g.addColorStop(0.24,'rgba(255,255,255,0.31)'); g.addColorStop(0.58,'rgba(255,255,255,0.13)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); }
const mwCloud=mwCloudTex();

// Dusty cloud sheets: mostly blue-gray and neutral, with restrained cream in the core.
const hazeTints=[0x8798bd,0xa7b0c8,0xc2c2bf,0xcab89f,0x748aaa,0x9b8ea7];
for(let i=0;i<72;i++){
  const th=(i/72)*Math.PI*2+(Math.random()-0.5)*0.10;
  const core=Math.exp(-Math.pow(aDist(th,4.78)/0.80,2));
  const side=(i%2?1:-1);
  const off=side*(0.050+Math.random()*0.090)+(Math.random()-0.5)*0.030;
  const p=mwDir(th,off);
  let tint=hazeTints[(Math.random()*hazeTints.length)|0];
  if(core>0.55 && Math.random()<0.38) tint=0xd0b794;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:mwCloud,color:tint,transparent:true,depthWrite:false,blending:THREE.NormalBlending,opacity:0.030+0.055*core+Math.random()*0.020,fog:false}));
  const w=64+Math.random()*52+core*34, h=28+Math.random()*30+core*16;
  s.scale.set(w,h,1); s.position.set(p[0],p[1],p[2]); milkyGroup.add(s);
}

// Broad translucent glow gives the band width and the slightly milky gray-blue cast seen in real skies.
for(let i=0;i<28;i++){
  const th=(i/28)*Math.PI*2+(Math.random()-0.5)*0.16;
  const core=Math.exp(-Math.pow(aDist(th,4.78)/0.82,2));
  const side=i%2?1:-1;
  const p=mwDir(th,side*(0.13+Math.random()*0.075));
  const tint=(core>0.58 && i%4===0)?0xc7b49e:(i%3===0?0x7d91b4:0x9ba6ba);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:mwCloud,color:tint,transparent:true,depthWrite:false,blending:THREE.NormalBlending,opacity:0.018+0.020*core,fog:false}));
  s.scale.set(104+Math.random()*48,50+Math.random()*30,1); s.position.set(p[0],p[1],p[2]); milkyGroup.add(s);
}

// Dark nebula / dust-rift patches.  These slightly dim the sky behind the Milky Way instead of glowing.
function mwDustTex(){ const c=document.createElement('canvas'); c.width=c.height=96; const x=c.getContext('2d');
  const g=x.createRadialGradient(48,48,4,48,48,47); g.addColorStop(0,'rgba(5,8,18,0.78)'); g.addColorStop(0.45,'rgba(7,10,22,0.42)'); g.addColorStop(1,'rgba(7,10,22,0)');
  x.fillStyle=g; x.fillRect(0,0,96,96); return new THREE.CanvasTexture(c); }
const mwDust=mwDustTex();
for(let i=0;i<24;i++){
  const th=(i/24)*Math.PI*2+(Math.random()-0.5)*0.18;
  const core=Math.exp(-Math.pow(aDist(th,4.78)/0.88,2));
  const p=mwDir(th,(Math.random()-0.5)*(0.022+0.020*core));
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:mwDust,transparent:true,depthWrite:false,blending:THREE.NormalBlending,opacity:0.16+0.12*core,fog:false}));
  s.scale.set(50+Math.random()*42+core*24,18+Math.random()*22+core*10,1); s.position.set(p[0],p[1],p[2]); milkyGroup.add(s);
}

// --- recognizable constellations ---
const constGroup=new THREE.Group(); scene.add(constGroup);
function constellation(az,el,pts,edges,scl){
  const dir=new THREE.Vector3(Math.cos(el)*Math.sin(az),Math.sin(el),Math.cos(el)*Math.cos(az)).multiplyScalar(290);
  const right=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),dir).normalize();
  const upv=new THREE.Vector3().crossVectors(dir,right).normalize();
  const V=pts.map(p=>dir.clone().addScaledVector(right,p[0]*scl).addScaledVector(upv,p[1]*scl));
  const pa=new Float32Array(V.length*3); V.forEach((v,i)=>{pa[i*3]=v.x;pa[i*3+1]=v.y;pa[i*3+2]=v.z;});
  const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pa,3));
  constGroup.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xf1f5ff,size:3.0,sizeAttenuation:false,fog:false,depthWrite:false,transparent:true,opacity:0.96})));
  const line=[];
  edges.forEach(e=>{ const a=V[e[0]],b=V[e[1]]; line.push(a.x,a.y,a.z,b.x,b.y,b.z); });
  const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.Float32BufferAttribute(line,3));
  constGroup.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0xa9bde4,transparent:true,opacity:0.34,fog:false,depthWrite:false})));

  const m=new THREE.Mesh(new THREE.PlaneGeometry(width,len),makeBeamMat(opacity));
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(right,up,normal));
  m.position.copy(base).add(up.clone().multiplyScalar(len*0.5));
  m.renderOrder=1;
  scene.add(m);
}

// The fish artwork's head points toward local -X.
// Rotate local -X onto the actual horizontal movement vector.
// A small Z rotation follows vertical movement too.
function orientFishPlane(f,x,y,z,fallbackX=1,fallbackZ=0){
  let vx=(f.prevX===null||f.prevX===undefined)?fallbackX:(x-f.prevX);
  let vy=(f.prevY===null||f.prevY===undefined)?0:(y-f.prevY);
  let vz=(f.prevZ===null||f.prevZ===undefined)?fallbackZ:(z-f.prevZ);

  let horiz=Math.hypot(vx,vz);
  if(horiz<0.000001){
    vx=fallbackX; vz=fallbackZ; horiz=Math.max(0.000001,Math.hypot(vx,vz));
  }

  // local head vector is (-1,0,0)
  f.spr.rotation.y=Math.atan2(vz,-vx);

  const pitch=Math.atan2(vy,horiz);
  f.spr.rotation.z=Math.max(-0.30,Math.min(0.30,-pitch));

  f.prevX=x;
  f.prevY=y;
  f.prevZ=z;
}

for(let i=0;i<0;i++){
  let x,z,tr=0; do{ x=(Math.random()-0.5)*(GW-2); z=(Math.random()-0.5)*(GD-2); tr++; }while(!scatterOK(x,z)&&tr<8);
  const k=(Math.random()*3)|0;
  const hh=2.6+Math.random()*1.6, ww=hh*TREE_AR[k];
  const s=vBillboard(treeTex[k], ww, hh, 0xffffff); s.position.x=x; s.position.z=z; treeCols.push({x,z});

}
function flowerTexGen(col){ const c=document.createElement('canvas'); c.width=12; c.height=16; const x=c.getContext('2d');
  x.fillStyle='#3a6b33'; x.fillRect(5,8,2,8);
  x.fillStyle=col; for(const p of [[6,4],[3,6],[9,6],[4,9],[8,9]]){ x.fillRect(p[0]-1,p[1]-1,3,3); }
  x.fillStyle='#f2d24f'; x.fillRect(5,6,2,2);
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter; return t; }
const flowerTex=['#7fbef2','#f28fb0','#f2e24f','#e8e8f2'].map(flowerTexGen);
for(let i=0;i<0;i++){
  const k=(Math.random()*flowerTex.length)|0;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:flowerTex[k], transparent:true, alphaTest:0.4 }));
  const hh=0.32+Math.random()*0.14, ww=hh*(12/16);
  s.scale.set(ww,hh,1); s.center.set(0.5,0); s.position.set((Math.random()-0.5)*(GW-1), 0, (Math.random()-0.5)*(GD-1)); scene.add(s);
}
function sgTexGen(){ const c=document.createElement('canvas'); c.width=14; c.height=10; const x=c.getContext('2d');
  x.fillStyle='#4f8a3a'; for(const bx of [3,6,9,11]){ x.fillRect(bx,3,1,7); x.fillRect(bx-1,5,1,5); }
  x.fillStyle='#5fa048'; x.fillRect(6,2,1,8);

const CITY_AR=[0.303,0.9167,0.4808,0.3667,0.881,0.5417,0.3103], CITY_H=[8.4,4.58,6.62,7.64,5.35,6.11,7.38];
const roofMat=new THREE.MeshLambertMaterial({ color:0x04070d });
function makeNightFacadeMat(tex, bottomGain, topGain, exposure){
  return new THREE.ShaderMaterial({
    uniforms:{
      map:{value:tex},
      bottomGain:{value:bottomGain},
      topGain:{value:topGain},
      exposure:{value:exposure}
    },
    vertexShader:
      'varying vec2 vUv;'+
      'void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:
      'uniform sampler2D map; uniform float bottomGain; uniform float topGain; uniform float exposure; varying vec2 vUv;'+
      'void main(){'+
      'vec4 tex=texture2D(map,vUv);'+
      'float t=smoothstep(0.02,0.98,vUv.y);'+
      'float g=mix(bottomGain,topGain,t);'+
      // keep original hue, but compress brightness into a controlled night range
      'vec3 c=tex.rgb;'+
      'float lum=dot(c,vec3(0.299,0.587,0.114));'+
      'c=mix(c, c/(0.55+0.45*max(lum,0.05)), 0.16);'+
      'c*=g*exposure;'+
      'c=pow(max(c,vec3(0.0)),vec3(0.92));'+
      'gl_FragColor=vec4(c,1.0);'+
      '}',
    transparent:false,
    depthWrite:true,
    depthTest:true,
    fog:false
  });
}

const sideMats=CT.map(t=>makeNightFacadeMat(
  t,
  0.78,  // lower floors: readable color
  0.46,  // upper floors: darker
  0.82   // overall night exposure
));
const glowBlank=new THREE.MeshBasicMaterial({ transparent:true, opacity:0, depthWrite:false });

function makeWindowGlowMat(tex, threshold, gain){
  return new THREE.ShaderMaterial({
    uniforms:{ map:{value:tex}, threshold:{value:threshold}, gain:{value:gain} },
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:
      'uniform sampler2D map; uniform float threshold; uniform float gain; varying vec2 vUv;'+
      'void main(){ vec4 c=texture2D(map,vUv);'+
      'float mx=max(c.r,max(c.g,c.b));'+
      'float mn=min(c.r,min(c.g,c.b));'+
      'float lum=dot(c.rgb,vec3(0.299,0.587,0.114));'+
      'float bright=max(lum,mx*0.88);'+
      'float mask=smoothstep(threshold,threshold+0.18,bright);'+
      'mask*=smoothstep(0.18,0.52,mx-mn+lum*0.38);'+
      'vec3 glow=c.rgb*(1.10+gain*0.75);'+
      'gl_FragColor=vec4(glow,mask*gain); }',
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, depthTest:true, fog:false
  });
}
const cityGlowMats=CT.map(t=>makeWindowGlowMat(t,0.52,0.70));

function cityBox(k,x,z,s){ s=s||1; const hh=CITY_H[k]*s, ww=hh*CITY_AR[k], dd=ww*0.95;
  const geo=new THREE.BoxGeometry(ww,hh,dd);
  const b=new THREE.Mesh(geo, [sideMats[k],sideMats[k],roofMat,roofMat,sideMats[k],sideMats[k]]);
  b.position.set(x, hh/2, z); b.castShadow=true; b.receiveShadow=true; scene.add(b);
  const glow=new THREE.Mesh(geo, [cityGlowMats[k],cityGlowMats[k],glowBlank,glowBlank,cityGlowMats[k],cityGlowMats[k]]);
  glow.position.copy(b.position); glow.scale.set(1.004,1.004,1.004); glow.renderOrder=3; scene.add(glow);
  return b; }

function addSeaRipple(uri,x,z,w,h,op,phase){
  const tx=pix(uri);

  const mat=new THREE.MeshBasicMaterial({
    map:tx, transparent:true, opacity:op,
    depthWrite:false, depthTest:true,
    blending:THREE.NormalBlending, color:0xb9efff,
    side:THREE.DoubleSide
  });
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  m.rotation.x=-Math.PI/2;
  m.position.set(x,0.086,z);
  m.renderOrder=3;
  scene.add(m);
  seaRipples.push({m,op,phase,baseX:x,baseZ:z});
}

  for(const yy of [0.28,height*0.50,height+0.15]){

    post.position.set(Math.cos(a)*radius,height/2+0.18,Math.sin(a)*radius); g.add(post);

    new THREE.MeshBasicMaterial({color:0x45dff2,transparent:true,opacity:0.035,depthWrite:false,side:THREE.DoubleSide}));

  return {group:g,platform,tube,light};
}

function makeJelly3D(scale=1,color=0x77eaff){
  const g=new THREE.Group();

  const shellMat=new THREE.MeshPhongMaterial({
    color,
    emissive:color,
    emissiveIntensity:0.82,
    transparent:true,
    opacity:0.58,
    shininess:145,
    specular:0xe7fbff,
    side:THREE.DoubleSide,
    depthWrite:false
  });

  const glowMat=new THREE.MeshBasicMaterial({
    color,
    transparent:true,
    opacity:0.16,
    blending:THREE.AdditiveBlending,
    depthWrite:false,
    side:THREE.DoubleSide
  });

  // Rounded dome only — open underneath like a jelly bell.
  const bell=new THREE.Mesh(
    new THREE.SphereGeometry(0.52,18,10,0,Math.PI*2,0,Math.PI*0.52),
    shellMat
  );
  bell.scale.set(1.0,0.86,1.0);
  g.add(bell);

  const rim=new THREE.Mesh(
    new THREE.TorusGeometry(0.49,0.035,6,24),
    glowMat.clone()
  );
  rim.rotation.x=Math.PI/2;
  rim.position.y=-0.015;
  g.add(rim);

  const core=new THREE.Mesh(
    new THREE.SphereGeometry(0.31,12,8),
    glowMat.clone()
  );
  core.scale.set(1.0,0.72,1.0);
  core.position.y=-0.01;
  core.material.opacity=0.23;
  g.add(core);

  // Slight outer halo gives an obvious underwater glow without a billboard.
  const halo=new THREE.Mesh(
    new THREE.SphereGeometry(0.68,12,8),
    glowMat.clone()
  );
  halo.scale.set(1.0,0.72,1.0);
  halo.position.y=0.02;
  halo.material.opacity=0.075;
  g.add(halo);

  const tentacles=[];
  const tentacleMat=new THREE.MeshBasicMaterial({
    color,
    transparent:true,
    opacity:0.54,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });

  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2;
    const root=new THREE.Group();
    root.position.set(Math.cos(a)*0.27,-0.15,Math.sin(a)*0.27);
    g.add(root);

    // two jointed segments so the tentacle can sway rather than rotate as one rod
    const seg1=new THREE.Mesh(
      new THREE.CylinderGeometry(0.018,0.026,0.48,6),
      tentacleMat.clone()
    );
    seg1.position.y=-0.24;
    root.add(seg1);

    const joint=new THREE.Group();
    joint.position.y=-0.47;
    root.add(joint);

    const seg2=new THREE.Mesh(
      new THREE.CylinderGeometry(0.010,0.018,0.46,6),
      tentacleMat.clone()
    );
    seg2.position.y=-0.23;
    joint.add(seg2);

    tentacles.push({root,joint,phase:i*0.95});
  }

  const light=new THREE.PointLight(color,0.34,3.3,2);
  light.position.y=0.02;
  g.add(light);

  g.userData.bell=bell;
  g.userData.rim=rim;
  g.userData.core=core;
  g.userData.halo=halo;
  g.userData.tentacles=tentacles;
  g.userData.light=light;
  g.scale.setScalar(scale);
  return g;
}

function animateJelly3D(j,time,phase=0){
  const pulse=0.5+0.5*Math.sin(time*0.050+phase);
  const squash=0.90+0.10*pulse;

  if(j.userData.bell){
    j.userData.bell.scale.set(1.0,0.78+0.10*pulse,1.0);
  }
  if(j.userData.core){
    j.userData.core.scale.set(0.96+0.07*pulse,0.66+0.09*pulse,0.96+0.07*pulse);
    j.userData.core.material.opacity=0.19+0.10*pulse;
  }
  if(j.userData.halo){
    const hs=0.96+0.08*pulse;
    j.userData.halo.scale.set(hs,0.69+0.07*pulse,hs);
    j.userData.halo.material.opacity=0.055+0.045*pulse;
  }
  if(j.userData.rim){
    j.userData.rim.material.opacity=0.14+0.12*pulse;
  }
  if(j.userData.light){
    j.userData.light.intensity=0.25+0.20*pulse;
  }

  for(const t of (j.userData.tentacles||[])){
    const wave=time*0.025+phase+t.phase;
    t.root.rotation.x=Math.sin(wave)*0.10;
    t.root.rotation.z=Math.cos(wave*0.92)*0.10;
    t.joint.rotation.x=Math.sin(wave*1.25+0.8)*0.16;
    t.joint.rotation.z=Math.cos(wave*1.08+0.4)*0.14;
    const stretch=0.92+0.10*Math.sin(wave*0.76);
    t.root.scale.y=stretch;
  }
}

    sc.behavior='dart';

    sc.targetTightness=0.60+Math.random()*0.10;

    // Tight bait-ball style grouping.
    sc.behavior='tighten';
    sc.targetSpeedMul=0.80+Math.random()*0.20;
    sc.targetTightness=0.48+Math.random()*0.12;
    sc.behaviorTimer=150+Math.random()*190;

    sc.orbitDir*=-1;

    sc.targetTightness=0.72;

    sc.targetTightness=1.30+Math.random()*0.18;

}

function makeRainLines(count, x0,x1, z0,z1, y0,y1, lenMin,lenMax, opacity){
  const pos=new Float32Array(count*6);
  const meta=[];
  for(let i=0;i<count;i++){
    const x=x0+Math.random()*(x1-x0);
    const y=y0+Math.random()*(y1-y0);
    const z=z0+Math.random()*(z1-z0);
    const len=lenMin+Math.random()*(lenMax-lenMin);
    pos[i*6]=x; pos[i*6+1]=y; pos[i*6+2]=z;
    pos[i*6+3]=x+0.035; pos[i*6+4]=y-len; pos[i*6+5]=z+0.018;
    meta.push({x,y,z,len,spd:0.085+Math.random()*0.075,drift:0.002+Math.random()*0.002});
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.LineBasicMaterial({
    color:0xa9d8e8,transparent:true,opacity,
    depthWrite:false,blending:THREE.NormalBlending
  });
  const lines=new THREE.LineSegments(geo,mat);
  lines.frustumCulled=false;
  scene.add(lines);
  return {lines,geo,pos,meta,x0,x1,z0,z1,y0,y1};
}

function triggerSplash(pool,x,y,z,scale=1){
  let s=pool.find(v=>!v.m.visible);
  if(!s) s=pool[(Math.random()*pool.length)|0];
  s.t=0;
  s.dur=18+Math.random()*13;
  s.m.visible=true;
  s.m.position.set(x,y,z);
  s.m.scale.setScalar(scale*0.32);
  s.m.material.opacity=0.52;
}

function updateSplashPool(pool,enabled){
  for(const s of pool){
    if(!enabled){ s.m.visible=false; continue; }
    if(!s.m.visible) continue;
    s.t++;
    const p=s.t/s.dur;
    s.m.scale.setScalar(0.32+p*1.35);
    s.m.material.opacity=(1-p)*0.46;
    if(p>=1) s.m.visible=false;
  }
}

function jellyTexGen(hex,frame=0){
  const c=document.createElement('canvas'); c.width=22; c.height=28; const x=c.getContext('2d');
  const OUT='#071018';

  // Chunky black pixel outline for the bell.
  x.fillStyle=OUT;
  x.fillRect(6,2,10,2);
  x.fillRect(4,4,14,2);
  x.fillRect(3,6,16,2);
  x.fillRect(2,8,18,7);
  x.fillRect(3,15,16,2);
  x.fillRect(5,17,12,2);

  // Bell fill.
  x.fillStyle=hex;
  x.fillRect(6,4,10,2);
  x.fillRect(5,6,12,2);
  x.fillRect(4,8,14,7);
  x.fillRect(5,15,12,2);

  // Tiny face + bright pixel highlight like the reference.
  x.fillStyle=OUT;
  x.fillRect(7,10,2,3);
  x.fillRect(14,10,2,3);
  x.fillStyle='rgba(255,255,255,0.92)';
  x.fillRect(15,6,2,2);
  x.fillRect(17,8,1,2);

  // Four segmented tentacles with alternating frame bends.
  const cols=[5,8,12,15];
  x.fillStyle=OUT;
  for(let i=0;i<cols.length;i++){
    const bx=cols[i];
    const bend=((i+frame)%2===0)?-1:1;

    // black outline segments
    x.fillRect(bx,18,3,3);
    x.fillRect(bx+bend,21,3,3);
    x.fillRect(bx,24,3,3);

    // inner colored pixels
    x.fillStyle=hex;
    x.fillRect(bx+1,18,1,2);
    x.fillRect(bx+bend+1,21,1,2);
    x.fillRect(bx+1,24,1,2);
    x.fillStyle=OUT;
  }

  const t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter;
  t.minFilter=THREE.NearestFilter;
  return t;
}

function getTankSystem(side){
  return sideTankSystems.find(t=>t.side===side);
}

function startTankFeeding(tank){
  // Only normal fish eat the lettuce; no jellyfish, rays, or seahorses.
  const candidates=sideTankFish.filter(f=>
    f.side===tank.side && (f.kind==='reef' || f.kind==='silver') && !f.feeding
  );
  if(!candidates.length) return;

  const f=candidates[(Math.random()*candidates.length)|0];
  f.feeding=true;
  f.feedTank=tank;
  tank.feeder=f;
  tank.feedPhase='approach';
  tank.feedT=0;
  tank.feedDuration=150+Math.floor(Math.random()*55);
  tank.feedStartX=f.spr.position.x;
  tank.feedStartY=f.spr.position.y;
  tank.feedStartZ=f.z;

  // leaf returns to full size before each visit
  tank.lettuce.scale.set(0.42,0.34,1);
}

function finishTankFeeding(tank){
  if(tank.feeder){
    tank.feeder.feeding=false;
    tank.feeder.feedTank=null;
    tank.feeder.prevX=tank.feeder.prevY=tank.feeder.prevZ=null;
  }
  tank.feeder=null;
  tank.feedPhase='idle';
  tank.feedT=0;
  tank.feedCooldown=1750+Math.random()*1850;
  tank.lettuce.scale.set(0.42,0.34,1);
}

      }

      // Animate the water spout while the whale is surfaced.
      if(whaleSpoutActive){
        whaleSpoutT++;
        const p=whaleSpoutT/WHALE_SPOUT_FRAMES;
        whaleSpout.visible=true;
        const wp=whaleSpoutGeo.attributes.position.array;
        const blowhole=lobbyWhale.localToWorld(new THREE.Vector3(1.72,0.54,0));

        for(let i=0;i<WHALE_SPOUT_N;i++){
          const m=whaleSpoutMeta[i];
          const q=Math.max(0,Math.min(1,(p-m.lag)/(1.0-m.lag)));
          const rise=Math.sin(q*Math.PI)*1.62*m.speed;
          const spread=Math.sin(q*Math.PI)*m.spread;

          wp[i*3]=blowhole.x+Math.cos(m.ang)*spread;
          wp[i*3+1]=Math.max(0.055,blowhole.y)+rise;
          wp[i*3+2]=blowhole.z+Math.sin(m.ang)*spread*0.55;
        }
        whaleSpoutGeo.attributes.position.needsUpdate=true;
        whaleSpout.material.opacity=0.78*(1.0-p);

        if(whaleSpoutT>=WHALE_SPOUT_FRAMES){
          whaleSpoutActive=false;
          whaleSpout.visible=false;
        }
      }

      if(whaleEventT>=total){
        whaleEventActive=false;
        lobbyWhale.visible=false;
        whaleSpout.visible=false;
        whaleSpoutActive=false;
        whaleEventCooldown=1800+Math.random()*2800;
      }
    }else{
      whaleEventCooldown--;
      if(whaleEventCooldown<=0) startWhaleEvent();
    }

    // --------------------------------------------------------
    // DOLPHIN: rise/breach -> dive almost vertically to floor -> despawn
    // --------------------------------------------------------
    if(lobbyDolphinActive){
      lobbyDolphinT++;
      const p=Math.min(1,lobbyDolphinT/lobbyDolphinDuration);
      const d=lobbyDolphins[lobbyDolphinWhich];
      const fx=Math.sin(lobbyDolphinYaw);
      const fz=-Math.cos(lobbyDolphinYaw);

      if(p<0.58){
        // Travel through the breach arc.
        const q=p/0.58;
        const arc=Math.sin(q*Math.PI);
        d.position.x=lobbyDolphinStartX+fx*lobbyDolphinTravel*q;
        d.position.z=lobbyDolphinStartZ+fz*lobbyDolphinTravel*q;
        d.position.y=lobbyDolphinStartY+arc*(lobbyDolphinPeakY-lobbyDolphinStartY);

        d.rotation.y=lobbyDolphinYaw;
        d.rotation.z=-0.48+0.96*q;
      }else{
        // After the dive point, go almost straight down to the seabed.
        const q=(p-0.58)/0.42;
        const diveX=lobbyDolphinStartX+fx*lobbyDolphinTravel;
        const diveZ=lobbyDolphinStartZ+fz*lobbyDolphinTravel;
        const diveStartY=lobbyDolphinStartY;

        d.position.x=diveX+fx*q*0.35;
        d.position.z=diveZ+fz*q*0.35;
        d.position.y=diveStartY+(lobbyDolphinFloorY-diveStartY)*(q*q);

        d.rotation.y=lobbyDolphinYaw;
        d.rotation.z=0.48+0.85*q;
      }

      if(p>=1){
        lobbyDolphinActive=false;
        d.visible=false;
        lobbyDolphinCooldown=2200+Math.random()*3600;
      }
    }else{
      lobbyDolphinCooldown--;
      if(lobbyDolphinCooldown<=0) startLobbyDolphinEvent();
    }

    // Compact fish schools move as small 3D clouds rather than flat horizontal lines.
    for(const sc of tinySchools){
      sc.cx += sc.dir*sc.spd;
      sc.cz = sc.baseCz + Math.sin(anim*0.0024+sc.ph)*0.72;
      sc.cy = Math.max(
        -8.50,
        Math.min(-0.38, sc.baseCy + Math.sin(anim*0.0031+sc.ph*1.4)*sc.depthAmp)
      );

      if(sc.cx<292.0){ sc.cx=292.0; sc.dir=1; }
      if(sc.cx>308.0){ sc.cx=308.0; sc.dir=-1; }
    }

    for(const f of lobbyTinyFish){
      const sc=f.school;
      const pulse=Math.sin(anim*0.018+f.ph);
      const x=sc.cx + f.ox*sc.dir + pulse*0.035;
      const y=Math.max(
        -8.68,
        Math.min(-0.30, sc.cy + f.oy + Math.sin(anim*0.012+f.ph)*0.075)
      );
      const z=sc.cz + f.oz + Math.sin(anim*0.005+f.ph)*sc.sway*0.30;

      const oldZ=f.prevZ;
      f.spr.position.set(x,y,z);
      orientFishPlane(f,x,y,z,sc.dir,0);

      // tiny bank while changing depth to keep the particles from looking paper-flat
      const dz=(oldZ===null||oldZ===undefined)?0:(z-oldZ);
      f.spr.rotation.x=Math.max(-0.16,Math.min(0.16,dz*9.0));
      f.spr.material.opacity=f.baseOpacity*(0.90+0.10*(0.5+0.5*pulse));
    }

    // Sparse tropical fish arc gently in Y/Z as they cross the vista.
    for(const f of lobbyTropicalFish){
      f.x+=f.dir*f.spd;
      if(f.x<291.4){ f.x=291.4; f.dir=1; }
      if(f.x>308.6){ f.x=308.6; f.dir=-1; }

      const ty=Math.max(-8.68,Math.min(-0.35,f.y+Math.sin(anim*0.009+f.ph)*0.34));
      const tz=f.z+Math.sin(anim*0.0034+f.ph)*0.56;
      const oldZ=f.prevZ;
      f.spr.position.set(f.x,ty,tz);
      orientFishPlane(f,f.x,ty,tz,f.dir,0);
      const dz=(oldZ===null||oldZ===undefined)?0:(tz-oldZ);
      f.spr.rotation.x=Math.max(-0.18,Math.min(0.18,dz*7.5));
    }

    // Seahorses mostly hover with a slow vertical bob and tiny side drift.
    for(const s of lobbySeahorses){
      s.spr.position.set(
        s.x+Math.sin(anim*0.0025+s.ph)*0.18,
        Math.max(-8.68,Math.min(-0.45,s.y+Math.sin(anim*0.007+s.ph)*0.22)),
        s.z+Math.cos(anim*0.002+s.ph)*0.14
      );
      s.spr.rotation.z=Math.sin(anim*0.004+s.ph)*0.07;
    }

    // Ray particles glide on a 3D path and gently flap instead of sliding flat.
    for(const r of lobbyRays){
      r.x+=r.dir*r.spd;
      if(r.x<291.6){ r.x=291.6; r.dir=1; }
      if(r.x>308.4){ r.x=308.4; r.dir=-1; }

      const ry=Math.max(-8.68,Math.min(-0.65,r.y+Math.sin(anim*0.0052+r.ph)*0.42));
      const rz=r.z+Math.sin(anim*0.0026+r.ph)*0.66;
      const oldZ=r.prevZ;
      r.spr.position.set(r.x,ry,rz);
      orientFishPlane(r,r.x,ry,rz,r.dir,0);

      const flap=0.90+0.10*(0.5+0.5*Math.sin(anim*0.040+r.ph));
      r.spr.scale.y=flap;
      const dz=(oldZ===null||oldZ===undefined)?0:(rz-oldZ);
      r.spr.rotation.x=Math.max(-0.20,Math.min(0.20,dz*7.0));
      r.spr.rotation.z+=Math.sin(anim*0.010+r.ph)*0.008;
    }


    // --------------------------------------------------------
    // Under-lobby fish schools.
    // --------------------------------------------------------
    for(const sc of underLobbySchools){
      sc.behaviorTimer--;
      if(sc.behaviorTimer<=0) chooseUnderLobbySchoolBehavior(sc);

      // Behaviors blend rather than snapping.
      sc.speedMul += (sc.targetSpeedMul-sc.speedMul)*0.018;
      sc.tightness += (sc.targetTightness-sc.tightness)*0.018;

      // After a short burst/turn, naturally relax back toward cruising.
      if(sc.behaviorTimer<45 && sc.behavior!=='cruise'){
        sc.targetSpeedMul=1.0;
        sc.targetTightness=1.0;
      }

      const da=sc.orbitDir*sc.orbitSpeed*sc.speedMul;
      sc.angle+=da;

      // The shaft is centered at x=300,z=-3.78.
      // Elliptical orbits keep the school outside the 2.05-radius glass tube.
      const wobble=Math.sin(anim*0.0015+sc.phase)*0.18;
      const radius=sc.radius+wobble;
      const radiusZ=sc.radiusZ+Math.cos(anim*0.0013+sc.phase)*0.14;

      sc.centerX=300+Math.cos(sc.angle)*radius;
      sc.centerZ=-3.78+Math.sin(sc.angle)*radiusZ;

      sc.centerY=Math.max(
        -6.18,
        Math.min(
          -1.55,
          sc.baseY
            +Math.sin(anim*sc.ySpeed+sc.yPhase)*sc.yAmp
            +Math.sin(anim*0.00062+sc.phase)*0.28
        )
      );

      // Tangent vector = school heading.
      let tx=-Math.sin(sc.angle)*radius*sc.orbitDir;
      let tz= Math.cos(sc.angle)*radiusZ*sc.orbitDir;
      const tl=Math.max(0.0001,Math.hypot(tx,tz));
      tx/=tl; tz/=tl;

      sc.vx=tx;
      sc.vz=tz;

      // Lean/bank into coordinated turns.
      const targetBank=Math.sin(sc.angle)*0.12*sc.orbitDir;
      sc.bank+=(targetBank-sc.bank)*0.045;
    }

    for(const f of underLobbyFish){
      const sc=f.school;

      // local tangent and side-normal directions
      const tx=sc.vx, tz=sc.vz;
      const nx=-tz, nz=tx;

      // Formation "breathing": school gently expands/contracts in addition to
      // behavioral tightening/spreading.
      const breathe=1.0+0.075*Math.sin(anim*0.006+f.phase+sc.phase);
      const formation=sc.tightness*breathe;

      // Small independent micro-swims while preserving the group.
      const microForward=Math.sin(anim*0.016+f.phase)*0.050;
      const microSide=Math.sin(anim*0.011+f.phase*1.7)*0.040;
      const microY=Math.sin(anim*0.013+f.phase)*0.060;

      const forward=(f.forward*formation)+microForward;
      const side=(f.sideways*formation)+microSide;

      let x=sc.centerX + tx*forward + nx*side;
      let z=sc.centerZ + tz*forward + nz*side;
      let y=sc.centerY + f.height*formation + microY;

      // Individual fish never descend beyond the new under-lobby limit.
      y=Math.max(-6.30,Math.min(-1.35,y));

      // Extra hard shaft avoidance. If a fish gets too close to the glass tube,
      // nudge it radially outward rather than letting it clip through.
      let dx=x-300, dz=z+3.78;
      let dist=Math.hypot(dx,dz);
      if(dist<2.30){
        const push=(2.30-dist);
        dx/=Math.max(0.001,dist);
        dz/=Math.max(0.001,dist);
        x+=dx*push;
        z+=dz*push;
      }

      f.spr.position.set(x,y,z);
      orientFishPlane(f,x,y,z,tx,tz);

      // Natural bank and pitch through turns / depth changes.
      f.spr.rotation.x+=sc.bank;
      f.spr.rotation.z+=Math.sin(anim*0.025+f.tailBeat)*0.018;

      // A school flashes slightly brighter during a fast dart.
      const dartBoost=Math.min(1,Math.max(0,(sc.speedMul-1.0)/1.5));
      f.spr.material.opacity=Math.min(
        0.72,
        f.baseOpacity*(0.92+0.08*Math.sin(anim*0.018+f.phase))+dartBoost*0.08
      );
    }

    for(const g of lobbyGlints){
      g.m.material.opacity=g.base*(0.35+0.65*(0.5+0.5*Math.sin(anim*0.026+g.phase)));
    }

    // Side display-tank life.
    for(const f of sideTankFish){
      // A feeding fish is controlled by its tank event below.
      if(f.feeding) continue;

      if(f.kind==='reef' || f.kind==='silver' || f.kind==='tankray'){
        f.z+=f.dir*f.spd;
        const cz=0.45, lim=(f.kind==='tankray'?1.85:2.05);
        if(f.z<cz-lim){ f.z=cz-lim; f.dir=1; }
        if(f.z>cz+lim){ f.z=cz+lim; f.dir=-1; }

        const sx=f.x+Math.sin(anim*0.008+f.ph)*0.035;
        const sy=f.y+Math.sin(anim*0.012+f.ph)*0.055;
        f.spr.position.set(sx,sy,f.z);
        orientFishPlane(f,sx,sy,f.z,0,f.dir);
        if(f.kind==='tankray') f.spr.rotation.z+=Math.sin(anim*0.008+f.ph)*0.008;
      }else if(f.kind==='horse'){
        f.spr.position.set(
          f.x+Math.sin(anim*0.003+f.ph)*0.035,
          f.y+Math.sin(anim*0.007+f.ph)*0.075,
          f.z+Math.cos(anim*0.0035+f.ph)*0.055
        );
        f.spr.rotation.z=Math.sin(anim*0.004+f.ph)*0.05;
      }else if(f.kind==='jelly'){
        f.spr.position.set(
          f.x+Math.sin(anim*0.003+f.ph)*0.050,
          f.y+Math.sin(anim*0.006+f.ph)*0.10,
          f.z+Math.cos(anim*0.0025+f.ph)*0.075
        );

        const frame=((anim*0.035+f.ph)%2)<1?0:1;
        if(f.frames && f.spr.material.map!==f.frames[frame]){
          f.spr.material.map=f.frames[frame];
          f.spr.material.needsUpdate=true;
        }
        const pulse=0.95+0.07*(0.5+0.5*Math.sin(anim*0.018+f.ph));
        const baseY=Math.abs(f.spr.scale.y);
        f.spr.scale.y=baseY*pulse;
        f.spr.material.rotation=Math.sin(anim*0.006+f.ph)*0.035;
      }
    }

    // Oxygenator bubbles.
    for(const b of sideTankBubbles){
      b.y+=b.spd;
      if(b.y>3.15){
        b.y=0.52+Math.random()*0.20;
        b.baseX+= (Math.random()-0.5)*0.015;
      }
      const bx=b.baseX+Math.sin(anim*0.018+b.ph)*0.035;
      const bz=b.baseZ+Math.cos(anim*0.014+b.ph)*0.025;
      b.spr.position.set(bx,b.y,bz);
      b.spr.material.opacity=0.28+0.24*(0.5+0.5*Math.sin(anim*0.021+b.ph));
    }

    // Occasional lettuce feeding.
    for(const tank of sideTankSystems){
      tank.feedCooldown--;

      // subtle leaf sway in the current
      const leafRot=Math.sin(anim*0.007+(tank.side<0?0:1.4))*0.045;
      tank.lettuce.material.rotation=leafRot;

      // keep the clip and the floating label attached to the lettuce
      const leafZ=tank.lettuce.position.z;
      tank.clipBase.position.set(tank.centerX+0.02,tank.lettuceY+0.14,leafZ+0.01);
      tank.clipJaw.position.set(tank.centerX+0.02,tank.lettuceY+0.165,leafZ+0.015);
      tank.note.position.set(
        tank.centerX,
        tank.lettuceY+0.68+Math.sin(anim*0.010+(tank.side<0?0.2:1.0))*0.035,
        leafZ
      );

      if(!tank.feeder && tank.feedCooldown<=0){
        startTankFeeding(tank);
      }

      if(!tank.feeder) continue;

      const f=tank.feeder;
      tank.feedT++;
      const total=tank.feedDuration;

      if(tank.feedPhase==='approach'){
        const p=Math.min(1,tank.feedT/(total*0.52));
        const e=p*p*(3-2*p);
        const targetX=tank.centerX;
        const targetY=tank.lettuceY+0.08;
        const targetZ=tank.lettuceZ+(f.dir>0?-0.15:0.15);

        const fx=tank.feedStartX+(targetX-tank.feedStartX)*e;
        const fy=tank.feedStartY+(targetY-tank.feedStartY)*e;
        const fz=tank.feedStartZ+(targetZ-tank.feedStartZ)*e;

        f.spr.position.set(fx,fy,fz);
        orientFishPlane(f,fx,fy,fz,0,(targetZ>=tank.feedStartZ?1:-1));

        if(p>=1){
          tank.feedPhase='nibble';
          tank.feedT=0;
          f.prevX=f.prevY=f.prevZ=null;
        }
      }
      else if(tank.feedPhase==='nibble'){
        const nibbleFrames=54;
        const p=Math.min(1,tank.feedT/nibbleFrames);
        const bite=Math.sin(tank.feedT*0.55);

        const targetX=tank.centerX;
        const targetY=tank.lettuceY+0.08+Math.max(0,bite)*0.025;
        const targetZ=tank.lettuceZ+(f.dir>0?-0.14:0.14);

        f.spr.position.set(targetX,targetY,targetZ);
        orientFishPlane(f,targetX,targetY,targetZ,0,(f.dir>0?1:-1));

        // tiny repeated peck/nibble motion + lettuce reaction
        const shrink=1.0-0.10*p;
        tank.lettuce.scale.set(0.42*shrink,0.34*shrink,1);
        tank.lettuce.position.z=tank.lettuceZ+Math.sin(tank.feedT*0.65)*0.018;

        if(p>=1){
          tank.feedPhase='leave';
          tank.feedT=0;
          tank.feedStartX=f.spr.position.x;
          tank.feedStartY=f.spr.position.y;
          tank.feedStartZ=f.spr.position.z;
          tank.lettuce.position.z=tank.lettuceZ;
          tank.note.position.z=tank.lettuceZ;
          f.prevX=f.prevY=f.prevZ=null;
        }
      }
      else if(tank.feedPhase==='leave'){
        const leaveFrames=78;
        const p=Math.min(1,tank.feedT/leaveFrames);
        const e=p*p*(3-2*p);

        // rejoin a normal lane away from the lettuce
        const targetZ=tank.cz+(Math.random()<0.5?-1:1)*(1.15+Math.random()*0.65);
        if(tank.returnTargetZ===undefined) tank.returnTargetZ=targetZ;

        const fx=tank.feedStartX+(f.x-tank.feedStartX)*e;
        const fy=tank.feedStartY+(f.y-tank.feedStartY)*e;
        const fz=tank.feedStartZ+(tank.returnTargetZ-tank.feedStartZ)*e;

        f.spr.position.set(fx,fy,fz);
        orientFishPlane(f,fx,fy,fz,0,(tank.returnTargetZ>=tank.feedStartZ?1:-1));

        if(p>=1){
          f.z=tank.returnTargetZ;
          f.dir=Math.random()<0.5?-1:1;
          delete tank.returnTargetZ;
          finishTankFeeding(tank);
        }
      }
    }

  }

  // Surface rain: active only on the exterior and surface-level lobby.
  const fieldRainOn=(zone==='field');
  const lobbyRainOn=(zone==='interior');
  fieldRain.lines.visible=fieldRainOn;
  lobbyRain.lines.visible=lobbyRainOn;

  function updateRainSystem(r,enabled){
    if(!enabled) return;
    const a=r.geo.attributes.position.array;
    for(let i=0;i<r.meta.length;i++){
      const m=r.meta[i];
      m.y-=m.spd;
      m.x+=m.drift;

      if(m.y<0.06){
        // Reset above the scene.
        m.y=r.y1+Math.random()*2.5;
        m.x=r.x0+Math.random()*(r.x1-r.x0);
        m.z=r.z0+Math.random()*(r.z1-r.z0);

        if(r===fieldRain){
          // Some drops hit the plaza, others hit the ocean behind the aquarium.
          if(m.z>-8.7 && m.z<8.8 && Math.random()<0.24){
            triggerSplash(fieldGroundSplashes,m.x,0.055,m.z,0.78+Math.random()*0.45);
          }else if(m.z<-9.4 && Math.random()<0.30){
            triggerSplash(fieldWaterSplashes,m.x,0.092,m.z,0.90+Math.random()*0.55);
          }
        }else if(r===lobbyRain && Math.random()<0.34){
          triggerSplash(lobbyWaterSplashes,m.x,0.094,m.z,0.92+Math.random()*0.55);
        }
      }

      const j=i*6;
      a[j]=m.x; a[j+1]=m.y; a[j+2]=m.z;
      a[j+3]=m.x+0.035; a[j+4]=m.y-m.len; a[j+5]=m.z+0.018;
    }
    r.geo.attributes.position.needsUpdate=true;
  }

  updateRainSystem(fieldRain,fieldRainOn);
  updateRainSystem(lobbyRain,lobbyRainOn);
  updateSplashPool(fieldGroundSplashes,fieldRainOn);
  updateSplashPool(fieldWaterSplashes,fieldRainOn);
  updateSplashPool(lobbyWaterSplashes,lobbyRainOn);

  // A few droplets creep down the panoramic glass while rain falls outside.
  for(const d of lobbyGlassDrops){
    d.m.visible=lobbyRainOn;
    if(!lobbyRainOn) continue;
    d.m.position.y-=d.spd;
    d.m.position.x+=Math.sin(anim*0.004+d.phase)*0.0008;
    d.m.material.opacity=0.13+0.12*(0.5+0.5*Math.sin(anim*0.010+d.phase));
    if(d.m.position.y<0.55){
      d.m.position.y=d.resetY;
      d.m.position.x=292.8+Math.random()*14.4;
    }
  }

  // underwater fish drift in loose schools beneath the surface
  for(const j of fieldJellies){
    j.x += j.dir*j.sideSpeed;
    if(j.x<-11.0){ j.x=-11.0; j.dir=1; }
    if(j.x>11.0){ j.x=11.0; j.dir=-1; }

    const ot=anim*j.driftSpeed+j.driftPhase;
    const va=anim*j.verticalSpeed+j.phase;

    const x=j.x+Math.sin(ot*1.5)*0.28;
    const z=j.baseZ+Math.cos(ot*0.78)*1.8;
    const y=j.baseY+Math.sin(va)*j.verticalAmp;

    j.g.position.set(x,y,z);
    j.g.rotation.y=j.dir>0?0:Math.PI;
    j.g.rotation.z=Math.sin(anim*0.0035+j.phase)*0.025-j.dir*0.028;
    animateJelly3D(j.g,anim,j.phase);
  }

  for(const f of seaFish){
    f.x += f.dir*f.spd;
    if(f.x < -23){ f.x=-23; f.dir=1; }
    if(f.x > 23){ f.x=23; f.dir=-1; }

    const zz=f.lane + Math.sin(anim*0.0048+f.ph)*0.82;
    const yy=f.baseY + Math.sin(anim*0.0072+f.ph*1.3)*0.19;
    const oldZ=f.prevZ;

    f.spr.position.set(f.x,yy,zz);
    orientFishPlane(f,f.x,yy,zz,f.dir,0);

    const dz=(oldZ===null||oldZ===undefined)?0:(zz-oldZ);
    f.spr.rotation.x=Math.max(-0.16,Math.min(0.16,dz*5.5));
    f.spr.material.opacity=0.28+0.10*(0.5+0.5*Math.sin(anim*0.014+f.ph));
  }

  waterUni.t.value += 0.005; foamUni.t.value += 0.010;
  { const fp=ffGeo.attributes.position.array;
    for(let i=0;i<FF;i++){ fp[i*3]+=Math.sin(anim*0.010+ffPh[i])*0.004; fp[i*3+1]+=Math.cos(anim*0.013+ffPh[i])*0.003; fp[i*3+2]+=Math.sin(anim*0.008+ffPh[i]*1.3)*0.004; }
    ffGeo.attributes.position.needsUpdate=true; }
  for(const p of seaProps){
    if(p.type==='dolphin'){
      if(p.cd===undefined){ p.cd=150+Math.random()*350; p.active=false; p.spr.visible=false; }
      if(p.active){ p.t++; const prog=p.t/62;
        if(prog>=1){ p.active=false; p.spr.visible=false; p.cd=280+Math.random()*480; }
        else { p.spr.visible=true; p.spr.position.set(p.jx, 0.06+Math.sin(prog*Math.PI)*1.05, p.jz); } }
      else { p.cd--; if(p.cd<=0){ p.active=true; p.t=0; p.jx=Math.random()*22-11; p.jz=-11-Math.random()*7; } }
    }
    else if(p.type==='boat'){
      p.spr.position.y=0.06+Math.sin((anim+p.ph*40)/55)*0.04;
      p.spr.position.x=p.bx+Math.sin((anim+p.ph*55)/230)*0.32;
    }
    else { p.spr.position.y=0.06+Math.sin((anim+p.ph*40)/75)*0.025; }
  }
  { const s=(Math.sin(anim/150)+1)/2, up=Math.max(0,s-0.72)*3.6; spout.material.opacity=up*0.8; spout.position.y=1.15+up*0.9; }
  const mp = moteGeo.attributes.position.array;
  for(let i=0;i<MOTE_N;i++){ mp[i*3+1]+=0.004;
    if(mp[i*3+1]>4.5){ mp[i*3+1]=0.2; mp[i*3]=(Math.random()-0.5)*GW; mp[i*3+2]=(Math.random()-0.5)*GD; } }
  moteGeo.attributes.position.needsUpdate=true;
  const bp=bubGeo.attributes.position.array;
  for(let i=0;i<BUB_N;i++){ bp[i*3+1]+=0.01; if(bp[i*3+1]>1.7){ bp[i*3+1]=0.3; bp[i*3]=tank.x+(Math.random()-0.5)*0.5; bp[i*3+2]=tank.z+(Math.random()-0.5)*0.5; } }
  bubGeo.attributes.position.needsUpdate=true;
  const bob = player.moving ? (Math.floor(anim/6)%2?0.03:0) : 0;
  pSpr.position.set(player.x, (state==='elevator'?0.22:bob), player.z);
  if(player.dir===2){ pTex.repeat.x=-0.25; pTex.offset.x=0.25; } else { pTex.repeat.x=0.25; pTex.offset.x=0; }
  pSpr.scale.x = PLW;
  pShadow.position.set(player.x, 0.02, player.z);
  if(state==='fpcam'){ const yaw=fpBaseYaw+fpYaw, pit=fpBasePitch+fpPitch, cp=Math.cos(pit);
    const fpc=fpCamPos||new THREE.Vector3(player.x,1.5,player.z);
    camera.position.copy(fpc);
    camera.lookAt(fpc.x+Math.sin(yaw)*cp, fpc.y+Math.sin(pit), fpc.z-Math.cos(yaw)*cp); pSpr.visible=false; }
  else if(state==='elevator'){
    pSpr.visible=true;
    camera.position.set(ELEV_X,3.35,ELEV_Z+2.65);
    camera.lookAt(ELEV_X,1.35,ELEV_Z-0.85);
  }
  else {
    pSpr.visible=true;
    if(zone==='interior'){
      camera.position.set(player.x+CAM_ROOM.x,CAM_ROOM.y,player.z+CAM_ROOM.z);
      camera.lookAt(player.x,1.75,player.z-0.65);
    }else if(zone==='underwater'){
      camera.position.set(player.x+CAM_UNDER.x,CAM_UNDER.y,player.z+CAM_UNDER.z);
      camera.lookAt(player.x,1.85,player.z-0.85);
    }else{
      camera.position.set(player.x+CAM.x,CAM.y,player.z+CAM.z);
      camera.lookAt(player.x,3.25,player.z);
    }
  }
  // scene-specific environment / skybox switching.
  // The lobby is still on the surface, so it shares the exact exterior sky.
  const lobbyEnv=(zone==='interior');
  const surfaceEnv=(zone==='field' || lobbyEnv);
  sky.visible=surfaceEnv;
  stars.visible=surfaceEnv;
  brightStars.visible=surfaceEnv;
  constGroup.visible=surfaceEnv;
  moonSpr.visible=surfaceEnv;
  milkyGroup.visible=surfaceEnv;

  for(const l of lobbyWaterLights) l.visible=lobbyEnv;
  for(const l of lobbyCeilingLights) l.visible=lobbyEnv;

  // Ceiling/front exit wall are only rendered in first person so they do not
  // block the normal dollhouse camera.
  lobbyFpsShell.visible=lobbyEnv && state==='fpcam';
  underLobbyLift.visible=lobbyEnv;
  underLobbyDepthLight.visible=lobbyEnv;

  if(!surfaceEnv){
    fieldRain.lines.visible=false;
    lobbyRain.lines.visible=false;
    for(const d of lobbyGlassDrops) d.m.visible=false;
  }

  lobbySeabed.visible=lobbyEnv;
  lobbyWater.visible=lobbyEnv;
  lobbyFoam.visible=lobbyEnv;
  const fieldPlay=(zone==='field' && state==='play');
  for(const j of fieldJellies) j.g.visible=(zone==='field');
  fieldEntryPad.visible=fieldPlay;
  fieldRailPad.visible=fieldPlay;
  lobbyExitPad.visible=lobbyEnv && state==='play';
  lobbyElevatorPad.visible=lobbyEnv && state==='play'; // circular elevator interaction marker
  lobbyViewPad.visible=lobbyEnv && state==='play';
  lobbyRightViewPad.visible=lobbyEnv && state==='play';
  for(const f of sideTankFish) f.spr.visible=lobbyEnv;
  for(const d of sideTankDecor) d.visible=lobbyEnv;
  for(const b of sideTankBubbles) b.spr.visible=lobbyEnv;
  for(const tank of sideTankSystems){
    tank.note.visible = lobbyEnv && state==='fpcam' && activeViewpoint && activeViewpoint.tankNoteSide===tank.side;
  }
  for(const p of sideTankPads) p.pad.visible=lobbyEnv && state==='play';

  for(const r of lobbySeaRipples) r.m.visible=lobbyEnv;
  for(const o of lobbyVistaObjects) o.visible=lobbyEnv;
  for(const f of lobbyLargeFish) f.g.visible=lobbyEnv;
  for(const j of lobbyJellies) j.g.visible=lobbyEnv;

  // Event animals manage their own visibility.
  lobbyWhale.visible=lobbyEnv && whaleEventActive;
  for(let i=0;i<lobbyDolphins.length;i++){
    lobbyDolphins[i].visible=lobbyEnv && lobbyDolphinActive && i===lobbyDolphinWhich;
  }

  for(const f of lobbyTinyFish) f.spr.visible=lobbyEnv;
  for(const f of lobbyTropicalFish) f.spr.visible=lobbyEnv;
  for(const s of lobbySeahorses) s.spr.visible=lobbyEnv;
  for(const r of lobbyRays) r.spr.visible=lobbyEnv;
  for(const f of underLobbyFish) f.spr.visible=lobbyEnv;
  if(!lobbyEnv){
    whaleSpout.visible=false;
    lobbyWhale.visible=false;
    for(const d of lobbyDolphins) d.visible=false;
  }
  for(const g of lobbyGlints) g.m.visible=lobbyEnv;

  if(fieldPlay){
    fieldEntryPad.material.opacity=0.34+0.22*(0.5+0.5*Math.sin(anim*0.042+0.2));
    fieldRailPad.material.opacity=0.30+0.22*(0.5+0.5*Math.sin(anim*0.042+1.4));
    const es=1.0+0.08*Math.sin(anim*0.034+0.2);
    const rs=1.0+0.08*Math.sin(anim*0.034+1.4);
    fieldEntryPad.scale.set(es,es,es);
    fieldRailPad.scale.set(rs,rs,rs);
  }

  if(lobbyEnv){
    lobbyExitPad.material.opacity=0.34+0.22*(0.5+0.5*Math.sin(anim*0.043+0.25));
    lobbyElevatorPad.material.opacity=0.58+0.24*(0.5+0.5*Math.sin(anim*0.045+0.7));
    const exs=1.0+0.08*Math.sin(anim*0.034+0.25);
    const els=1.0+0.10*Math.sin(anim*0.034+0.7);
    lobbyExitPad.scale.set(exs,exs,exs);
    lobbyElevatorPad.scale.set(els,els,els);

    lobbyViewPad.material.opacity=0.38+0.24*(0.5+0.5*Math.sin(anim*0.045));
    lobbyRightViewPad.material.opacity=0.38+0.24*(0.5+0.5*Math.sin(anim*0.045+1.1));
    const ps=1.0+0.08*Math.sin(anim*0.035);
    const prs=1.0+0.08*Math.sin(anim*0.035+1.1);
    lobbyViewPad.scale.set(ps,ps,ps);
    lobbyRightViewPad.scale.set(prs,prs,prs);

    for(const p of sideTankPads){
      p.pad.material.opacity=0.34+0.20*(0.5+0.5*Math.sin(anim*0.040+p.ph));
      const s=1.0+0.06*Math.sin(anim*0.032+p.ph);
      p.pad.scale.set(s,s,s);
    }
  }

  sky.position.copy(camera.position);
  const CELESTIAL_Y=-14;
  stars.position.copy(camera.position); stars.position.y+=CELESTIAL_Y;
  brightStars.position.copy(camera.position); brightStars.position.y+=CELESTIAL_Y;
  constGroup.position.copy(camera.position); constGroup.position.y+=CELESTIAL_Y;
  moonSpr.position.copy(camera.position).add(MOON_OFF); moonSpr.position.y+=CELESTIAL_Y*0.58;
  stars.rotation.y -= 0.00011;
  brightStars.rotation.y = stars.rotation.y;
  constGroup.rotation.y = stars.rotation.y;
  milkyGroup.rotation.y = stars.rotation.y;
  milkyGroup.position.copy(camera.position); milkyGroup.position.y+=CELESTIAL_Y;
}
const bloomC=document.getElementById('bloom'), bctx=bloomC.getContext('2d');
bloomC.width=RW; bloomC.height=RH;
function fit(){ const W=innerWidth, H=innerHeight;
  RH=300; RW=Math.max(1,Math.round(RH*W/H));
  renderer.setSize(RW,RH,false); camera.aspect=RW/RH; camera.updateProjectionMatrix();
  bloomC.width=RW; bloomC.height=RH;
  GAME.style.width='100%'; GAME.style.height='100%';
  document.getElementById('dialogue').style.fontSize=Math.max(13,Math.round(W/48))+'px'; }
addEventListener('resize',fit); fit();
try{ window.focus(); }catch(e){}
addEventListener('load', ()=>{ try{ window.focus(); }catch(e){} });
function frame(){ update(); renderer.render(scene, camera);
  if(bloomOn){ bctx.clearRect(0,0,RW,RH); bctx.drawImage(GAME,0,0,RW,RH); }
  updateInteractHint();
  syncDialogue(); requestAnimationFrame(frame); }
document.fonts.load('13px GameThai').catch(()=>{}).finally(()=> requestAnimationFrame(frame));

</script>
</body>
</html>
